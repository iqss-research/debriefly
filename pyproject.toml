[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "debriefly"
version = "0.7.7"
authors = [
  {name="Vineet Bansal", email="vineetb@princeton.edu"}
]
description = "Debriefly speaking, this does very little."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "azure==4.0.0",
    "azure-search",
    "azure-search-documents",
    "fastapi==0.110.3",
    "jinja2",
    "numpy",
    "openai",
    "python-dotenv",
    "requests",
    "requests_oauth2client",
    "rich",
    "pydantic==2.10.5",
    "reflex==0.5.10",
    "reflex-chakra==0.5.10",
    "reflex-clerk @ git+https://github.com/vineetbansal/reflex-clerk.git@ba87f3dfc6f21c1e70baca4dc051813202715036",
    "sqlalchemy==2.0.36",
    "sqlmodel==0.0.22",
    "authlib",
    "psycopg2-binary",
    "pyyaml"
]

[project.scripts]
debriefly = "debriefly.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.package-data]
debriefly = ["config.yaml", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-sv"

[project.optional-dependencies]
dev = [
    "build",
    "coverage",
    "coveralls",
    "myst-parser",
    "pre-commit",
    "pytest==8.3.5",
    "sphinx",
    "sphinxcontrib-bibtex",
    "sphinx_rtd_theme",
    "twine"
]
